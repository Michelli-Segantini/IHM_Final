<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vagas de emprego – protótipo de redesign</title>
<style>
  :root {
    --bg: #f3f5f2;
    --surface: #ffffff;
    --text: #17211c;
    --muted: #3f4d46;
    --line: #cfd8d2;
    --primary: #00623a;
    --primary-dark: #004a2c;
    --gold: #e0b020;
    --title: #0b2a1e;
    --note-bg: #fff3c4;
    --note-text: #4d3900;
    --err-bg: #fdeaea;
    --err-text: #9b1c1c;
    --radius: 10px;
    /* escala tipográfica fixa: uma única família e poucos tamanhos */
    --fs-base: 1.125rem;   /* 18 px */
    --fs-small: 1rem;      /* 16 px */
    --fs-title: 1.25rem;   /* 20 px */
    --fs-h1: 1.75rem;      /* 28 px */
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: var(--fs-base);
    line-height: 1.5;
    color: var(--text);
    background: var(--bg);
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }

  .app-header { background: var(--primary); color: #fff; padding: 16px 0 20px; border-bottom: 6px solid var(--gold); }
  .brand { margin: 0; font-size: var(--fs-small); letter-spacing: .04em; text-transform: uppercase; }
  h1 { margin: 2px 0 0; font-size: var(--fs-h1); line-height: 1.2; }

  main.wrap { padding-top: 24px; padding-bottom: 48px; }

  form { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  label { display: block; font-weight: 700; margin-bottom: 6px; }
  input[type="search"] {
    width: 100%; min-height: 52px; padding: 10px 12px; font: inherit;
    border: 2px solid #6b7a72; border-radius: 8px; background: #fff; color: var(--text);
  }
  input[type="search"]::placeholder { color: #55625b; }
  .hint { margin: 6px 0 14px; font-size: var(--fs-small); color: var(--muted); }

  .btn-primary {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; min-height: 52px; border: 0; border-radius: 8px; font: inherit; font-weight: 700;
    background: var(--primary); color: #fff; cursor: pointer;
  }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-primary svg { width: 22px; height: 22px; }
  button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid #ffbf47; outline-offset: 2px; }

  .link {
    font: inherit; margin: 0 6px 0 2px; min-height: 44px; padding: 8px 6px;
    border: 0; background: none; color: var(--primary); cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px; font-weight: 600;
  }
  .link:hover { color: var(--primary-dark); }

  #summary { margin: 24px 0 12px; font-weight: 700; scroll-margin-top: 12px; }
  #summary:focus { outline: none; }
  #summary.empty { background: var(--surface); border: 1px dashed #8a998f; border-radius: var(--radius); padding: 14px; font-weight: 500; }
  #summary .link { margin-left: 0; display: inline-block; }

  ul.results { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .card h3 { margin: 0; font-size: var(--fs-base); }
  .card-toggle {
    position: relative; display: block; width: 100%; text-align: left; font: inherit; color: inherit;
    background: none; border: 0; padding: 16px 48px 16px 16px; cursor: pointer; min-height: 52px;
  }
  .card-toggle:hover { background: #eef4f0; }
  .card-toggle .t { display: block; font-weight: 800; font-size: var(--fs-title); line-height: 1.25; color: var(--title); overflow-wrap: anywhere; }
  .card-toggle .meta { display: block; color: var(--muted); font-size: var(--fs-small); margin-top: 4px; font-weight: 400; }
  .card-toggle .exige {
    display: block; margin-top: 10px; padding: 8px 10px; border-left: 5px solid var(--gold);
    background: var(--note-bg); color: var(--note-text); font-size: var(--fs-small); font-weight: 400; border-radius: 4px;
  }
  .card-toggle .exige b { font-weight: 800; }
  .card-toggle .benef { display: block; margin-top: 8px; font-size: var(--fs-small); font-weight: 400; color: var(--text); }
  .card-toggle .benef b { font-weight: 800; }
  .chev {
    position: absolute; right: 18px; top: 24px; width: 11px; height: 11px;
    border-right: 3px solid var(--primary); border-bottom: 3px solid var(--primary); transform: rotate(45deg);
    transition: transform .15s;
  }
  .card-toggle[aria-expanded="true"] .chev { transform: rotate(-135deg); top: 28px; }
  @media (prefers-reduced-motion: reduce) { .chev { transition: none; } }

  .status { display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; padding: 2px 12px; border-radius: 999px; font-size: var(--fs-small); font-weight: 700; }
  .status::before { content: ""; width: 9px; height: 9px; background: currentColor; }
  .status.open { background: #e3f3e8; color: #0b5a27; }
  .status.open::before { border-radius: 50%; }
  .status.closed { background: #e8eaed; color: #3b434d; }
  .status.closed::before { border-radius: 2px; }
  .badge { display: inline-block; margin-top: 8px; padding: 2px 10px; border-radius: 999px; font-size: var(--fs-small); font-weight: 700; background: #e1ecff; color: #14367a; }

  .details { border-top: 1px solid var(--line); padding: 14px 16px 18px; background: #fafcfa; }
  dl { margin: 0; display: grid; gap: 10px; }
  dl div { display: grid; grid-template-columns: 9rem 1fr; gap: 8px; }
  dt { color: var(--muted); font-weight: 700; }
  dd { margin: 0; overflow-wrap: anywhere; }
  @media (max-width: 420px) { dl div { grid-template-columns: 1fr; gap: 0; } }
  .desc { margin: 14px 0 0; padding-top: 12px; border-top: 1px dashed var(--line); max-width: 60ch; }
  .desc h4 { margin: 0 0 4px; font-size: var(--fs-base); }
  .desc p { margin: 0; }
  .contact { margin: 14px 0 0; padding-top: 12px; border-top: 1px dashed var(--line); display: grid; gap: 10px; }
  .contact h4 { margin: 0; font-size: var(--fs-base); }
  .btn-contact {
    display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 10px 14px;
    border: 2px solid var(--primary); border-radius: 8px; background: #fff; color: var(--primary-dark);
    font-weight: 700; text-decoration: none; overflow-wrap: anywhere;
  }
  .btn-contact:hover { background: #eef4f0; }
  .btn-contact:focus-visible { outline: 3px solid #ffbf47; outline-offset: 2px; }
  .btn-contact svg { width: 22px; height: 22px; flex: none; }
  .tag-ex { display: inline-block; margin-left: 6px; font-size: .8rem; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; vertical-align: middle; }

  #top {
    position: fixed; right: 16px; bottom: 16px; z-index: 10;
    width: 52px; height: 52px; padding: 0; border: 0; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--primary); color: #fff; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
    visibility: hidden; opacity: 0; transition: opacity .15s, visibility .15s;
  }
  #top.show { visibility: visible; opacity: 1; }
  #top:hover { background: var(--primary-dark); }
  #top svg { width: 26px; height: 26px; }
  @media (prefers-reduced-motion: reduce) { #top { transition: none; } }
</style>
</head>
<body>

<header class="app-header">
  <div class="wrap">
    <p class="brand">Casa do Trabalhador</p>
    <h1>Vagas de emprego</h1>
  </div>
</header>

<main class="wrap">
  <form id="form" role="search" novalidate>
    <label for="q">Qual vaga você procura?</label>
    <input id="q" type="search" autocomplete="off" placeholder="Ex.: soldador, eletricista" aria-describedby="q-hint">
    <p id="q-hint" class="hint">Digite o nome da vaga ou uma palavra da descrição. Deixe em branco para ver todas.</p>

    <button class="btn-primary" id="go" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
      Pesquisar
    </button>
  </form>

  <p id="summary" aria-live="polite" tabindex="-1"></p>
  <ul id="results" class="results"></ul>
</main>

<button id="top" type="button" aria-label="Voltar ao topo" title="Voltar ao topo">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<script>
  /* Dados:
     - Soldador: campos copiados da Figura 11 do relatório (texto em caixa alta convertido para
       maiúsculas/minúsculas normais; erros de digitação corrigidos). O nº de vagas não aparece na
       captura e por isso não é exibido.
     - Eletromecânico pleno: título, ID, nº de vagas e início da descrição vistos na Figura 9; texto resumido.
     - Eletricista: dado de exemplo, apenas para demonstrar a busca. */
  var VAGAS = [
    { id: "26030", titulo: "Soldador", situacao: "Aberta", vagas: null, periodo: "Diurno", exp: "6 meses",
      exige: "Curso de solda", escolaridade: "Alfabetizado", informatica: "Sem conhecimento",
      pcd: false, idioma: "Português",
      jornada: "Segunda a quinta, das 07h às 17h; sexta, das 07h às 16h",
      beneficios: "Alimentação no local, seguro de vida", cadastro: "04/11/2026", local: "Santa Bárbara d’Oeste",
      descricao: "Irá unir e cortar peças de ligas metálicas, preparar equipamentos, acessórios e consumíveis de soldagem e corte, preparar peças a serem soldadas, realizar leitura e interpretação de desenhos técnicos, entre outras atividades correlatas." },
    { id: "26052", titulo: "Tosador", situacao: "Aberta", vagas: 1, periodo: "Diurno", exp: "6 meses",
      exige: "Curso de banho e tosa", escolaridade: "Ensino fundamental completo", informatica: "Sem conhecimento",
      pcd: false, idioma: "Português", jornada: "Segunda a sexta, das 08h às 17h",
      beneficios: "Almoço no local, vale-transporte", cadastro: "10/11/2026", local: "Santa Bárbara d’Oeste",
      descricao: "Irá realizar banho e tosa em cães e gatos, higienizar o ambiente e os equipamentos, receber e orientar os tutores e acompanhar o bem-estar dos animais durante o atendimento." },
    { id: "—", titulo: "Eletricista", situacao: "Encerrada", vagas: 2, periodo: "Diurno", exp: "12 meses",
      exige: "Ensino médio completo", escolaridade: "Ensino médio completo", informatica: "Sem conhecimento",
      pcd: false, idioma: "Português", jornada: "Segunda a sexta, das 08h às 17h",
      beneficios: "Vale-transporte", cadastro: "—", local: "Santa Bárbara d’Oeste",
      descricao: "Descrição de exemplo: instalação e manutenção de redes elétricas em edifícios residenciais.",
      exemplo: true }
  ];

  /* Contato fictício, só para o protótipo (o sistema real mostra o contato do departamento no fim dos detalhes). */
  var CONTATO = { tel: "(19) 3000-0000", telLink: "+551930000000", email: "vagas@exemplo.gov.br" };
  var ICON_TEL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>';
  var ICON_MAIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>';

  var form = document.getElementById("form");
  var qInput = document.getElementById("q");
  var summary = document.getElementById("summary");
  var list = document.getElementById("results");

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function norm(s) { return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
  function row(dt, dd) { return dd ? "<div><dt>" + esc(dt) + "</dt><dd>" + esc(dd) + "</dd></div>" : ""; }

  function lev(a, b) {
    var m = a.length, n = b.length, d = [], i, j;
    for (i = 0; i <= m; i++) { d[i] = [i]; }
    for (j = 1; j <= n; j++) { d[0][j] = j; }
    for (i = 1; i <= m; i++) for (j = 1; j <= n; j++) {
      d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    }
    return d[m][n];
  }
  function suggest(q) {
    var nq = norm(q), best = null, bestD = 3;
    if (nq.length < 4) return null;
    VAGAS.forEach(function (v) {
      norm(v.titulo).split(/\s+/).forEach(function (w) {
        var dist = lev(nq, w);
        if (dist < bestD) { bestD = dist; best = v.titulo; }
      });
    });
    return best;
  }

  function card(v) {
    var meta = [];
    if (v.vagas) meta.push(v.vagas + (v.vagas === 1 ? " vaga" : " vagas"));
    if (v.periodo) meta.push(v.periodo);
    if (v.exp) meta.push("experiência: " + v.exp);
    if (v.contrato) meta.push(v.contrato.toLowerCase());
    var tags = "";
    var aberta = v.situacao === "Aberta";
    return '<li class="card"><article>' +
      '<h3><button type="button" class="card-toggle" aria-expanded="false" aria-controls="d' + esc(v.titulo.replace(/\W/g, "")) + '">' +
        '<span class="t">' + esc(v.titulo) + tags + '</span>' +
        (meta.length ? '<span class="meta">' + esc(meta.join(" · ")) + '</span>' : '') +
        '<span class="status ' + (aberta ? 'open' : 'closed') + '">' + esc(v.situacao) + '</span>' +
        (v.exige ? '<span class="exige"><b>Exige:</b> ' + esc(v.exige) + '</span>' : '') +
        (v.beneficios ? '<span class="benef"><b>Benefícios:</b> ' + esc(v.beneficios) + '</span>' : '') +
        (v.pcd ? '<span class="badge">Vaga para pessoa com deficiência</span>' : '') +
        '<span class="chev" aria-hidden="true"></span>' +
      '</button></h3>' +
      '<div id="d' + esc(v.titulo.replace(/\W/g, "")) + '" class="details" hidden>' +
        '<dl>' + row("Situação", v.situacao) + row("Escolaridade", v.escolaridade) + row("Experiência", v.exp) +
          row("Informática", v.informatica) + row("Horário", v.jornada || v.periodo) +
          row("Contrato", v.contrato) + row("Local", v.local) + row("Idioma", v.idioma) +
          row("Benefícios", v.beneficios) +
          row("Vaga para pessoa com deficiência", v.pcd ? "Sim" : "Não") +
          row("Código da vaga", v.id !== "—" ? v.id : null) + row("Cadastrada em", v.cadastro !== "—" ? v.cadastro : null) + '</dl>' +
        '<div class="desc"><h4>Atribuições</h4><p>' + esc(v.descricao) + '</p></div>' +
        '<div class="contact"><h4>Contato</h4>' +
          '<a class="btn-contact" href="tel:' + CONTATO.telLink + '">' + ICON_TEL + 'Ligar: ' + esc(CONTATO.tel) + '</a>' +
          '<a class="btn-contact" href="mailto:' + CONTATO.email + '">' + ICON_MAIL + esc(CONTATO.email) + '</a>' +
        '</div>' +
      '</div></article></li>';
  }

  function search() {
    var q = qInput.value.trim(), nq = norm(q);
    var matches = VAGAS.filter(function (v) { return !nq || norm(v.titulo + " " + v.descricao).indexOf(nq) !== -1; });
    list.innerHTML = ""; // nova pesquisa: limpa a lista anterior e fecha os detalhes
    list.innerHTML = matches.map(card).join("");

    if (matches.length === 0) {
      var s = suggest(q);
      summary.className = "empty";
      summary.innerHTML = "Nenhuma vaga encontrada para “" + esc(q) + "”. " +
        (s ? 'Você quis dizer <button type="button" class="link" id="sug">' + esc(s) + '</button>? ' : "Confira a escrita ou tente outra palavra. ") +
        '<button type="button" class="link" id="all">Ver todas as vagas</button>';
      var sug = document.getElementById("sug");
      if (sug) sug.addEventListener("click", function () { qInput.value = s; search(); });
      document.getElementById("all").addEventListener("click", function () { qInput.value = ""; search(); });
    } else {
      summary.className = "";
      summary.textContent = q
        ? matches.length + (matches.length === 1 ? " vaga encontrada" : " vagas encontradas") + " para “" + q + "”."
        : matches.length + " vagas disponíveis.";
    }
    return matches.length;
  }
  function goToResults() {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    summary.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
    summary.focus({ preventScroll: true });
  }
  function run() { search(); goToResults(); }

  form.addEventListener("submit", function (e) { e.preventDefault(); });
  document.getElementById("go").addEventListener("click", run);
  qInput.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); run(); } });

  list.addEventListener("click", function (e) {
    var btn = e.target.closest(".card-toggle");
    if (!btn) return;
    var panel = document.getElementById(btn.getAttribute("aria-controls"));
    var open = btn.getAttribute("aria-expanded") === "true";
    btn.setAttribute("aria-expanded", open ? "false" : "true");
    panel.hidden = open;
  });

  // Botão "Voltar ao topo": aparece depois de rolar a página.
  var topBtn = document.getElementById("top");
  function toggleTop() {
    var y = window.pageYOffset || document.documentElement.scrollTop;
    topBtn.classList.toggle("show", y > 300);
  }
  window.addEventListener("scroll", toggleTop, { passive: true });
  toggleTop();
  topBtn.addEventListener("click", function () {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
    var h = document.querySelector("h1");
    h.setAttribute("tabindex", "-1");
    h.focus({ preventScroll: true });
  });

  search(); // estado inicial: todas as vagas, como no sistema atual
</script>
</body>
</html>
